name=TinyCTS
version=1.0
author=Phil Schatzmann
maintainer= https://github.com/pschatzmann
sentence=A Bluetooth Current Time Service (CTS) client and server for Arduino
paragraph=Reads the time from a phone, watch or other BLE device with the Current Time Service, or serves the time of your board (system clock, RTC, GPS, NTP) to the BLE devices around it. Works with NimBLE-Arduino (ESP32, nRF5), ArduinoBLE, the Raspberry Pi Pico W, and on the desktop with BlueZ (Linux), CoreBluetooth (macOS) and WinRT (Windows), and comes with a command line tool for the desktop.
